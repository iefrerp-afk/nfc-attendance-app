name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Clean Duplicate Folders and Misplaced Tests
      run: |
        # 1. Remove duplicate nested folders
        rm -rf app/src/main/java/pk/edu/nfc/attendance/app
        # 2. Remove misplaced test file from production sources
        rm -f app/src/main/java/pk/edu/nfc/attendance/ConflictEngineTest.kt
        # 3. List remaining structure
        find app/src/main/java -maxdepth 3

    - name: Build APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: nfc-attendance-app
        path: app/build/outputs/apk/debug/app-debug.apk
